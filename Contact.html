<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentaCare Dental Clinic</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color:#009dff">
                <i class="fa-solid fa-tooth"></i>
                <span>DentaCare</span></a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="About.html">About</a></li>
                    <li><a href="Services.html">Services</a></li>
                    <li><a href="Doctors.html">Doctors</a></li>
                    <li><a href="Contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
            <a href="#" class="btn bookBtn">Book Appointment</a>
        </div>
    </header>

    <section class="contact">

        <div class="container">

            <div class="contact-wrapper">

                <div class="contact-info">

                    <h2>Contact Us</h2>

                    <p>
                        We'd love to hear from you. Reach out to us for any queries or assistance.
                    </p>

                    <div class="info-box">
                        <i class="fa-solid fa-location-dot"></i>
                        <span>Jaipur, Rajasthan</span>
                    </div>

                    <div class="info-box">
                        <i class="fa-solid fa-phone"></i>
                        <span>+91 9876543210</span>
                    </div>

                    <div class="info-box">
                        <i class="fa-solid fa-envelope"></i>
                        <span>info@dentacare.com</span>
                    </div>

                </div>


                <div class="contact-form">

                    <form>

                        <input type="text" placeholder="Your Name" required>

                        <input type="email" placeholder="Your Email" required>

                        <input type="text" placeholder="Subject">

                        <textarea rows="6" placeholder="Your Message"></textarea>

                        <button type="submit" class="btn">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>
    </section>

    <footer>

        <p>

            © 2026 DentaCare Dental Clinic. All Rights Reserved.

        </p>

    </footer>
    <div id="appointmentContainer"></div>

    <script src="SCRIPT/index.js"></script>
</body>

</html>
